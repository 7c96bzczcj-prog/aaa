# datasets.yaml — candidate list for Phase 2 (spec v3.0 §5.2), version 0.1 (DRAFT, awaiting user confirmation)
#
# One entry per stratum = dataset_id × tissue × suspension_type (§8.1). All are NORMAL / adult / author-
# annotated reference atlases from CELLxGENE Census LTS 2025-11-08. Human and mouse kept separate; cell and
# nucleus kept separate (§2, §3). accession_verified: true means the dataset_id, tissue, suspension_type and
# normal-cell presence were confirmed by direct Census obs query on 2026-10-13.
#
# Ambient-RNA note: Census source matrices are author-filtered (no empty droplets) and this environment has
# no GPU, so SoupX/CellBender cannot be run here. Per the user-approved decision ①B, candidates are computed
# on ambient-uncorrected data and flagged ambient_uncorrected=TRUE as provisional (see README).

